appId: io.catsonkeyboard.yutugis
productName: YutuGIS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: yutugis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # ── 正式分发前必改 ─────────────────────────────────────────────────────────
  # notarize: false 仅适用于本地/测试构建。公开发布的未公证 dmg 会被 macOS
  # Gatekeeper 拦截（提示"已损坏，无法打开"）。公证需要：
  #   1. Apple Developer 账号 + Developer ID Application 证书签名
  #   2. 环境变量（electron-builder 自动读取，不要写进本文件/仓库）：
  #      APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  #      （或 App Store Connect API key: APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER）
  #   3. 然后把下行改为 notarize: true
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# ── 自动更新源（发布前替换）─────────────────────────────────────────────────
# 当前 URL 是脚手架占位符，正式发布前替换为真实的静态文件服务。generic provider
# 只要求一个目录里按 electron-updater 约定存放 latest-mac.yml / latest-linux.yml /
# latest.yml 和安装包文件。用 GitHub Releases 的示例：
#   publish:
#     provider: github
#     owner: catsonkeyboard
#     repo: yutu-gis
# 注意：CI 打 tag 构建时优先用命令行 --publish always 或 env.PUBLISH，
# 本配置只作为本地构建的兜底。
publish:
  provider: generic
  url: https://example.com/auto-updates
